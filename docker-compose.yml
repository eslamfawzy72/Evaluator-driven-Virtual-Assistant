services:
  redis:
    image: redis:latest
    container_name: evaluator-generator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: evaluator-generator-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the Docker network, Redis is reachable by service name, not localhost
      REDIS_HOST: redis
      CHROMA_PERSIST_DIR: /app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
